name: Build and Sync to R2

on:
  workflow_dispatch: # 允许你手动点击触发
  schedule:
    - cron: '0 0 * * *' # 每天凌晨 0 点自动检查一次官方更新

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests UnityPy Pillow boto3

      - name: Get Current Official Version
        run: |
          python scripts/getCurrentVersion.py --json-output current_version.json

      - name: Run Build Scripts (Generate Catalog, Manifest, Bundle)
        run: |
          python scripts/update_resources.py --current-version-file current_version.json

      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto

      - name: Upload to R2 using Python
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ba-uncensor
        run: |
          python scripts/uploadR2.py
      - name: Update current.txt
        run: |
          python scripts/updateCurrentVersion.py --resource-version ${{ env.OFFICIAL_RESOURCE_VERSION }} --table-version ${{ env.OFFICIAL_TABLE_VERSION }}

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add current.txt
          git commit -m "Auto-update current.txt" || exit 0
          git push
