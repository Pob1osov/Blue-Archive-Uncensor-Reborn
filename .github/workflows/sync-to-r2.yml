name: Build and Sync to R2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get Current Official Version
        env:
          # 🚀 在这里填入你刚生成的 Cloudflare Worker 地址
          VERSION_API_URL: https://ba-version-proxy.zoerliu.workers.dev
        run: |
          python scripts/getCurrentVersion.py --json-output current_version.json
          python -c "import json; d=json.load(open('current_version.json')); print(f'RESOURCE_VERSION={d[\"ResourceVersion\"]}')" >> $GITHUB_ENV
          python -c "import json; d=json.load(open('current_version.json')); print(f'TABLE_VERSION={d[\"TableVersion\"]}')" >> $GITHUB_ENV

      - name: Run Build Scripts (Generate Catalog, Manifest, Bundle)
        run: |
          python scripts/update_resources.py --current-version-file current_version.json

      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto

      - name: Upload to R2 using Python
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ba-uncensor
        run: |
          python scripts/uploadR2.py

      - name: Update current.txt
        run: |
          python scripts/updateCurrentVersion.py --resource-version ${{ env.RESOURCE_VERSION }} --table-version ${{ env.TABLE_VERSION }}

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add current.txt
          git commit -m "Auto-update current.txt [skip ci]" || exit 0
          git push
